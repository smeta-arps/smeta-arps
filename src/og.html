<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;800&display=swap" rel="stylesheet">
<style>
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { position: relative; font-family: "Onest", sans-serif; color: #fff; background: #26294e url(hero-original-2752.jpeg) center / cover; }
body::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, rgba(28,30,59,.95) 0%, rgba(38,41,78,.88) 55%, rgba(38,41,78,.7) 100%); }
.in { position: relative; z-index: 1; padding: 64px 72px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
.logo { display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 30px; }
.logo .mark { width: 64px; height: 64px; border-radius: 16px; background: #fff; display: grid; place-items: center; }
.logo .mark img { width: 52px; height: 52px; }
.logo b { color: #8fe0a6; }
h1 { margin: 0; font-size: 76px; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em; max-width: 900px; }
h1 span { color: #8fe0a6; }
.row { display: flex; gap: 14px; font-size: 24px; font-weight: 500; }
.row span { padding: 10px 18px; border-radius: 999px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); }
.row span.g { background: #3ab65a; border-color: #3ab65a; }
</style>
</head>
<body>
<div class="in">
  <div class="logo"><span class="mark"><img src="../web/img/logo-mark.png" alt=""></span><span>Смета <b>в АРПС</b></span></div>
  <h1>Смета из Word и Excel <span>в&nbsp;Estimate за минуту</span></h1>
  <div class="row"><span class="g">Бесплатно</span><span>Без регистрации</span><span>Файл остаётся у вас</span></div>
</div>
</body>
</html>
